<!doctype html>
<meta charset="utf-8">
<title>h2</title>
<script type="importmap">{ "imports": { "three": "../vendor/three.module.js", "three/addons/": "../vendor/addons/" } }</script>
<style>html,body{margin:0;background:#000}canvas{display:block}#log{display:none}</style>
<div id="log"></div>
<canvas id="gl"></canvas>
<script>
window.addEventListener('error', (e) => {
  const log = document.getElementById('log');
  log.textContent = (e.message || 'error') + '\n' + (e.error && e.error.stack || '');
  document.title = 'ERR';
  document.body.dataset.ready = '0';
});
</script>
<script type="module">
import * as THREE from 'three';
import { makePaceCar, auditPaceCar, preloadH2 } from '../js/pace-car.js';
try {
await preloadH2();
const params = new URLSearchParams(location.search);
const view = params.get('view') || 'front';
const h2 = makePaceCar(params.get('low') === '1');
const fails = auditPaceCar(h2);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8aa0b4);
scene.environment = null;
scene.add(new THREE.HemisphereLight(0xe7f1fb, 0x4a4036, 1.05));
const key = new THREE.DirectionalLight(0xfff6ea, 1.65); key.position.set(6, 8, 5); scene.add(key);
const fill = new THREE.DirectionalLight(0xc9d7e6, .85); fill.position.set(-6, 3, 2); scene.add(fill);
const rim = new THREE.DirectionalLight(0xffe2b8, 1.1); rim.position.set(-3, 5, -6); scene.add(rim);
const ground = new THREE.Mesh(new THREE.CircleGeometry(10, 48), new THREE.MeshStandardMaterial({ color: 0x2c3238, roughness: .9 }));
ground.rotation.x = -Math.PI / 2; scene.add(ground);
scene.add(h2);
const cam = new THREE.PerspectiveCamera(38, 1280 / 720, .05, 80);
// 38° vertical is a 35mm full-frame lens. Match sits at about 1.2 m.
const shots = {
  front: [[5.15, 1.20, 3.35], [0.15, 0.92, 0], 38],
  match: [[3.35, 1.20, -4.65], [0.05, 0.92, 0.12], 38],
  fascia: [[4.15, 1.05, 0.15], [1.55, 0.95, 0], 38],
  side: [[-0.05, 1.15, 6.55], [-0.05, 0.95, 0], 38],
  rear: [[-5.35, 1.20, 3.15], [-0.25, 0.95, 0], 38],
  wheel: [[1.72, 0.48, 2.05], [1.56, 0.44, 0.92], 26],
  grille: [[3.35, 0.98, 0.55], [2.20, 0.96, 0], 26]
};
const [pos, look, fov] = shots[view] || shots.front;
if (fov) { cam.fov = fov; cam.updateProjectionMatrix(); }
cam.position.set(...pos); cam.lookAt(...look);
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gl'), antialias: true });
renderer.setSize(1280, 720); renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.render(scene, cam);
const log = document.getElementById('log');
const ok = fails.length === 0;
log.textContent = `tris ${h2.userData.triangles} draws ${h2.userData.drawCalls} view ${view} ${h2.userData.source || 'procedural'}\n${ok ? 'PASS' : fails.join('\n')}`;
document.title = ok ? 'PASS' : 'FAIL';
document.body.dataset.ready = ok ? '1' : '0';
} catch (err) {
  const log = document.getElementById('log');
  log.textContent = String(err && err.stack || err);
  document.title = 'ERR';
  document.body.dataset.ready = '0';
}
</script>
