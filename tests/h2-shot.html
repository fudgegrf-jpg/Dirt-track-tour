<!doctype html>
<meta charset="utf-8">
<title>h2</title>
<script type="importmap">{ "imports": { "three": "../vendor/three.module.js", "three/addons/": "../vendor/addons/" } }</script>
<style>html,body{margin:0;background:#000}canvas{display:block}#log{display:none}</style>
<div id="log"></div>
<canvas id="gl"></canvas>
<script>
window.addEventListener('error', (e) => {
  const log = document.getElementById('log');
  log.textContent = (e.message || 'error') + '\n' + (e.error && e.error.stack || '');
  document.title = 'ERR';
  document.body.dataset.ready = '0';
});
</script>
<script type="module">
import * as THREE from 'three';
import { makePaceCar, auditPaceCar, preloadH2, bindPaceEnv } from '../js/pace-car.js';
try {
await preloadH2();
const params = new URLSearchParams(location.search);
const view = params.get('view') || 'front';
const h2 = makePaceCar(params.get('low') === '1');
const fails = auditPaceCar(h2);
const scene = new THREE.Scene();
const rake = params.get('rake') === '1' || view === 'hood' || view === 'door';
scene.background = new THREE.Color(rake ? 0x9aa3ab : 0x8aa0b4);
scene.add(new THREE.HemisphereLight(0xe7f1fb, 0x4a4036, rake ? 0.35 : 1.05));
if (rake) {
  h2.traverse(o => {
    if (!o.isMesh) return;
    for (const m of [].concat(o.material)) {
      if (!m || (m.name !== 'paint' && m.name !== 'h2-paint')) continue;
      m.roughness = 0.82; m.metalness = 0; m.envMapIntensity = 0;
      if ('clearcoat' in m) m.clearcoat = 0;
      m.needsUpdate = true;
    }
  });
  const graze = new THREE.DirectionalLight(0xffffff, 2.4);
  graze.position.set(view === 'door' ? -4 : 3.2, 1.35, view === 'door' ? 0.2 : 2.4);
  scene.add(graze);
} else {
  const key = new THREE.DirectionalLight(0xfff6ea, 1.65); key.position.set(6, 8, 5); scene.add(key);
  const fill = new THREE.DirectionalLight(0xc9d7e6, .85); fill.position.set(-6, 3, 2); scene.add(fill);
  const rim = new THREE.DirectionalLight(0xffe2b8, 1.1); rim.position.set(-3, 5, -6); scene.add(rim);
}
const ground = new THREE.Mesh(new THREE.CircleGeometry(10, 48), new THREE.MeshStandardMaterial({ color: 0x2c3238, roughness: .9 }));
ground.rotation.x = -Math.PI / 2; scene.add(ground);
scene.add(h2);
const cam = new THREE.PerspectiveCamera(38, 1280 / 720, .05, 80);
// 38° vertical is a 35mm full-frame lens. Match sits at about 1.2 m.
const shots = {
  front: [[5.15, 1.20, 3.35], [0.15, 0.92, 0], 38],
  match: [[3.35, 1.20, -4.65], [0.05, 0.92, 0.12], 38],
  fascia: [[4.55, 0.92, 0.02], [2.05, 0.78, 0], 34],
  side: [[-0.05, 1.15, 6.55], [-0.05, 0.95, 0], 38],
  rear: [[-5.35, 1.20, 3.15], [-0.25, 0.95, 0], 38],
  wheel: [[1.72, 0.48, 2.05], [1.56, 0.44, 0.92], 26],
  grille: [[3.35, 0.98, 0.55], [2.20, 0.96, 0], 26],
  corner: [[2.85, 0.85, -2.15], [1.25, 0.62, -0.55], 32],
  corner2: [[2.85, 0.85, 2.15], [1.25, 0.62, 0.55], 32],
  under: [[2.55, 0.22, 0.35], [1.55, 0.42, 0.0], 38],
  hood: [[2.15, 1.85, 1.55], [1.15, 1.35, 0.0], 30],
  door: [[0.15, 1.22, 2.55], [-0.05, 1.12, 0.95], 28]
};
const [pos, look, fov] = shots[view] || shots.front;
if (fov) { cam.fov = fov; cam.updateProjectionMatrix(); }
cam.position.set(...pos); cam.lookAt(...look);
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gl'), antialias: true });
renderer.setSize(1280, 720); renderer.setPixelRatio(1);
scene.environment = bindPaceEnv(renderer, h2);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.render(scene, cam);
const log = document.getElementById('log');
const ok = fails.length === 0;
log.textContent = `tris ${h2.userData.triangles} draws ${h2.userData.drawCalls} view ${view} ${h2.userData.source || 'procedural'}\n${ok ? 'PASS' : fails.join('\n')}`;
document.title = ok ? 'PASS' : 'FAIL';
document.body.dataset.ready = ok ? '1' : '0';
} catch (err) {
  const log = document.getElementById('log');
  log.textContent = String(err && err.stack || err);
  document.title = 'ERR';
  document.body.dataset.ready = '0';
}
</script>
