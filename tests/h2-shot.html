<!doctype html>
<meta charset="utf-8">
<title>h2</title>
<script type="importmap">{ "imports": { "three": "../vendor/three.module.js", "three/addons/": "../vendor/addons/" } }</script>
<style>html,body{margin:0;background:#000}canvas{display:block}#log{display:none}</style>
<div id="log"></div>
<canvas id="gl"></canvas>
<script type="module">
import * as THREE from 'three';
import { makePaceCar } from '../js/pace-car.js';
const view = new URLSearchParams(location.search).get('view') || 'front';
const h2 = makePaceCar(false);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8aa0b4);
scene.environment = null;
scene.add(new THREE.HemisphereLight(0xe7f1fb, 0x4a4036, 1.05));
const key = new THREE.DirectionalLight(0xfff6ea, 2.4); key.position.set(6, 8, 5); scene.add(key);
const fill = new THREE.DirectionalLight(0xc9d7e6, .85); fill.position.set(-6, 3, 2); scene.add(fill);
const rim = new THREE.DirectionalLight(0xffe2b8, 1.1); rim.position.set(-3, 5, -6); scene.add(rim);
const ground = new THREE.Mesh(new THREE.CircleGeometry(10, 48), new THREE.MeshStandardMaterial({ color: 0x2c3238, roughness: .9 }));
ground.rotation.x = -Math.PI / 2; scene.add(ground);
scene.add(h2);
const cam = new THREE.PerspectiveCamera(42, 1280 / 720, .05, 40);
const shots = {
  front: [0, [4.2, 1.42, 3.35], [.1, .95, 0]],
  rear: [Math.PI, [4.15, 1.45, -3.3], [-.15, 1.0, 0]],
  side: [Math.PI / 2, [0.1, 1.25, 6.4], [0, .95, 0]]
};
const [yaw, pos, look] = shots[view] || shots.front;
h2.rotation.y = yaw;
cam.position.set(...pos); cam.lookAt(...look);
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gl'), antialias: true });
renderer.setSize(1280, 720); renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.render(scene, cam);
const log = document.getElementById('log');
log.textContent = `tris ${h2.userData.triangles} view ${view}\nPASS`;
document.title = 'PASS';
document.body.dataset.ready = '1';
</script>
