<title>Dirt Track Tour — Late Model Season</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>
  :root { --clay:#b5532a; --clay2:#7a3518; --sand:#e9c9a0; --ink:#1a0f0a; --panel:rgba(22,12,8,0.86); --gold:#ffc83d; --ok:#5fd16a; --bad:#ff5a4a; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:#0b0705; overflow:hidden; font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color:#f4e6d6; }
  #gl { position:fixed; inset:0; width:100%; height:100%; display:block; }
  #ui { position:fixed; inset:0; pointer-events:none; }
  #ui > * { pointer-events:auto; }
  .screen { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  .panel { background:var(--panel); border:1px solid rgba(233,201,160,0.25); border-radius:14px; box-shadow:0 20px 60px rgba(0,0,0,0.6); padding:22px 26px; backdrop-filter: blur(6px); }
  h1,h2,h3 { margin:0 0 10px; font-family: Impact, "Arial Black", sans-serif; letter-spacing:1px; font-weight:400; }
  .logo { font-size:86px; line-height:0.9; color:#fff; text-shadow: 0 4px 0 var(--clay2), 0 8px 30px rgba(0,0,0,0.8); font-style:italic; text-align:center; }
  .logo small { display:block; font-size:24px; color:var(--sand); letter-spacing:6px; font-style:normal; margin-top:10px; font-family: "Segoe UI", Arial; font-weight:700; text-shadow:none; }
  button { font: 700 15px "Segoe UI", Arial; color:#1a0f0a; background:linear-gradient(#ffd77a,#f0a23a); border:0; border-radius:8px; padding:10px 18px; cursor:pointer; box-shadow:0 3px 0 #8a4b10; margin:4px; }
  button:hover { filter:brightness(1.08); } button:active { transform:translateY(2px); box-shadow:0 1px 0 #8a4b10; }
  button.alt { background:linear-gradient(#e8d8c8,#bfa58b); box-shadow:0 3px 0 #6b5440; }
  button.bad { background:linear-gradient(#ff8a7a,#d8432f); box-shadow:0 3px 0 #7a1d10; color:#fff; }
  button:disabled { opacity:0.4; cursor:not-allowed; filter:grayscale(1); }
  input, select { font:600 15px "Segoe UI", Arial; padding:7px 10px; border-radius:6px; border:1px solid #6b4a30; background:#2a1a10; color:#fff; }
  .row { display:flex; gap:12px; align-items:center; }
  .money { font: 700 22px Impact, Arial Black; color:var(--gold); letter-spacing:1px; }
  table { border-collapse:collapse; width:100%; font-size:14px; }
  td, th { padding:5px 8px; border-bottom:1px solid rgba(255,255,255,0.08); text-align:left; }
  th { color:var(--sand); font-weight:700; font-size:12px; text-transform:uppercase; letter-spacing:1px; }
  tr.me td { color:var(--gold); font-weight:700; }
  .muted { color:#bba48e; font-size:13px; }
  #fade { position:fixed; inset:0; background:#000; pointer-events:none; opacity:0; z-index:40; }
  #pause, #settings { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#000a; backdrop-filter: blur(3px); z-index:50; }
  #settings { z-index:60; }
  .set-row { margin:10px 0; } .set-row label { width:150px; } .set-row input[type=range] { flex:1; } .set-row span { width:48px; text-align:right; }
  .toast { position:fixed; left:50%; bottom:28px; transform:translateX(-50%); background:#111d; color:#fff; padding:10px 18px; border-radius:8px; border:1px solid #ffffff30; z-index:70; transition:opacity .5s; font-size:14px; }
  .toast.out { opacity:0; }
  .res-head { display:flex; align-items:baseline; gap:16px; margin:6px 0 8px; }
  .res-pos { font:italic 900 54px Impact, Arial Black; text-shadow:0 3px 0 #0008; }
  .res-sub { color:#e8d6bf; font-size:14px; }
  .res-table td:nth-child(n+3), .res-table th:nth-child(n+3) { text-align:right; }
  .up { color:#6fe07a; font-weight:700; } .down { color:#ff6b5a; font-weight:700; }
  .payout { margin:12px 0 6px; padding:10px 14px; background:#0006; border:1px solid #ffffff1c; border-radius:8px; }
  .payout h3 { margin:0 0 6px; }
  .payout .pl { display:flex; justify-content:space-between; padding:3px 0; font-size:14px; }
  .payout .pl.bonus b { color:#6fe07a; } .payout .pl.neg b { color:#ff9a8a; }
  .payout .pl.total { border-top:1px solid #ffffff30; margin-top:4px; padding-top:6px; font-size:16px; }
  .bar { height:10px; background:#3a2416; border-radius:5px; overflow:hidden; width:160px; display:inline-block; vertical-align:middle; }
  .bar > i { display:block; height:100%; background:linear-gradient(90deg,#5fd16a,#ffc83d,#ff5a4a); }
  .pips span { display:inline-block; width:14px; height:14px; border-radius:3px; background:#3a2416; margin-right:3px; border:1px solid #6b4a30; }
  .pips span.on { background:var(--gold); }
  .card { background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); border-radius:10px; padding:12px 14px; margin-bottom:10px; }
